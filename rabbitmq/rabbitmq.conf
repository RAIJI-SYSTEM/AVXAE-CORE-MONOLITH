# Carrega usuário, vhost e exchanges do definitions.json no boot.
# ATENÇÃO: com definitions o RabbitMQ NÃO cria o usuário padrão
# (RABBITMQ_DEFAULT_USER/PASS são ignorados) — o usuário vem do definitions.json.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json

# Não reimporta a cada boot se o arquivo não mudou
definitions.skip_if_unchanged = true
