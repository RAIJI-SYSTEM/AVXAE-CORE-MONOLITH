server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Evita loop: Promtail não lê os próprios logs nem os do Loki.
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(raiji-loki|raiji-promtail)"
        action: drop
      # Só containers do projeto Raiji (evita ingerir logs de outros projetos locais).
      - source_labels: ["__meta_docker_container_name"]
        regex: "/raiji-.*"
        action: keep
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: compose_service
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: compose_project
    pipeline_stages:
      - docker: {}

  # Logs de execução dos testes (arquivos reports/testes/logs/*.log).
  - job_name: test-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: test-logs
          log_type: test
          service: avxae-core-monolith
          __path__: /workspace/AVXAE-CORE-MONOLITH/reports/testes/logs/*.log
      - targets: [localhost]
        labels:
          job: test-logs
          log_type: test
          service: front-pwa
          __path__: /workspace/FRONT-PWA/reports/testes/logs/*.log
      - targets: [localhost]
        labels:
          job: test-logs
          log_type: test
          service: message-service
          __path__: /workspace/MESSAGE-SERVICE/reports/testes/logs/*.log
    relabel_configs:
      - source_labels: [__path__]
        regex: '.*/([^/]+\.log)'
        target_label: filename
