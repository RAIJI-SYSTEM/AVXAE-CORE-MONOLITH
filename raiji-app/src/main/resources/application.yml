server:
  port: 8080

spring:
  application:
    name: raiji

  datasource:
    url: jdbc:postgresql://localhost:5432/raiji_app
    username: raiji
    password: raiji123
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8180/realms/raiji/protocol/openid-connect/certs

  # Foto da CNH na verificação de motorista
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB

management:
  endpoints:
    web:
      exposure:
        include: health

raiji:
  keycloak:
    base-url: http://localhost:8180
    realm: raiji
    admin-client-id: raiji-admin
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:raiji-admin-secret}
  # S2-05 / RN04 — estorno automático via Stripe (modo sandbox/testes).
  # A chave NUNCA é commitada: vem de variável de ambiente (sk_test_*).
  # Vazia => StripeService considera "não configurado" e não chama a API.
  stripe:
    api-key: ${STRIPE_API_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}

  # Comissão da plataforma sobre caronas pagas, em % (1.5 = 1,5%; 0 desliga).
  # Descontada do que o motorista recebe: o passageiro paga o preço anunciado.
  # Fica gravada na carona ao publicar (mudar aqui não altera caronas existentes).
  pricing:
    platform-fee-percent: ${RAIJI_PLATFORM_FEE_PERCENT:1.5}

  # Fuso das caronas: os horários são "hora de parede" no Brasil (o Docker roda em UTC).
  time-zone: ${RAIJI_TIME_ZONE:America/Sao_Paulo}

  # Empresas: consulta do CNPJ na Receita (BrasilAPI, dados abertos, grátis).
  companies:
    cnpj-base-url: ${RAIJI_CNPJ_BASE_URL:https://brasilapi.com.br}
    timeout-seconds: 15

  # Regras liga/desliga.
  # intermunicipal-requires-business: só conta PJ (CNPJ/MEI) publica carona entre
  # cidades diferentes. Desligada por enquanto.
  rules:
    intermunicipal-requires-business: ${RAIJI_INTERMUNICIPAL_REQUIRES_BUSINESS:false}

  # E-mails transacionais (Resend). Chave no .env da raiz; sem chave nada é enviado.
  # RESEND_FROM: use um domínio verificado no Resend. O padrão (onboarding@resend.dev)
  # só entrega para o e-mail do dono da conta Resend.
  mail:
    resend:
      api-key: ${RESEND_API_KEY:}
      base-url: ${RESEND_BASE_URL:https://api.resend.com}
      from: ${RESEND_FROM:Raiji <onboarding@resend.dev>}

  # Verificação da CNH para virar motorista (Infosimples: OCR + SENATRAN/Validar CNH).
  # Segredos só por variável de ambiente (no .env da raiz, fora do git).
  # Sem token => a verificação responde 503 (nada é chamado).
  driver-verification:
    infosimples:
      base-url: ${INFOSIMPLES_BASE_URL:https://api.infosimples.com}
      token: ${INFO_SIMPLES_KEY:}
      govbr-cpf: ${INFOSIMPLES_GOVBR_CPF:}
      govbr-password: ${INFOSIMPLES_GOVBR_SENHA:}
      timeout-seconds: 120
    # Foto da CNH: guardada só durante a verificação e apagada na decisão.
    # Local: RustFS (127.0.0.1:9010). Produção: S3 (sem endpoint e sem chaves: role da EC2).
    storage:
      bucket: ${DRIVER_DOCS_BUCKET:raiji-driver-docs}
      region: ${AWS_REGION:us-east-1}
      endpoint: ${DRIVER_DOCS_S3_ENDPOINT:http://localhost:9010}
      path-style: ${DRIVER_DOCS_S3_PATH_STYLE:true}
      access-key: ${DRIVER_DOCS_S3_ACCESS_KEY:raiji}
      secret-key: ${DRIVER_DOCS_S3_SECRET_KEY:raiji12345}
